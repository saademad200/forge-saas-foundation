packages:
  - "packages/*"
  - "apps/*"
  - "tooling/*"

# Build scripts are opt-in (pnpm's supply-chain guard). esbuild ships vitest's
# transform binary and needs its postinstall; it is the only dependency allowed
# to run a build script.
allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - '@next/env@15.5.25'
  - '@next/swc-darwin-arm64@15.5.25'
  - '@next/swc-darwin-x64@15.5.25'
  - '@next/swc-linux-arm64-gnu@15.5.25'
  - '@next/swc-linux-arm64-musl@15.5.25'
  - '@next/swc-linux-x64-gnu@15.5.25'
  - '@next/swc-linux-x64-musl@15.5.25'
  - '@next/swc-win32-arm64-msvc@15.5.25'
  - '@next/swc-win32-x64-msvc@15.5.25'
  - next@15.5.25
